<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>頭像預覽</title>
<style>
  body{margin:0;background:radial-gradient(800px 600px at 50% -10%,#27306a,#0f1226);
    color:#f4f6ff;font-family:"Noto Sans TC",system-ui,sans-serif;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:40px}
  h1{margin:0;font-size:1.3rem}
  .sizes{display:flex;align-items:flex-end;gap:36px}
  .item{text-align:center}
  .item img{display:block;border-radius:50%}
  .lbl{margin-top:8px;color:#9aa3c7;font-size:.8rem}
  .row{display:flex;align-items:center;gap:12px;background:#11163066;border:1px solid #343d6b;
    border-radius:12px;padding:12px 16px;min-width:260px}
  .row img{width:34px;height:34px;border-radius:50%}
  .row .nm{flex:1;font-weight:600}
  .row .sc{font-weight:800;color:#2ec27e}
  .big img{width:200px;height:200px}
</style></head>
<body>
  <h1>🏀 Kobe 卡通頭像 — 風格測試</h1>
  <div class="sizes">
    <div class="item big"><img src="kobe.svg"><div class="lbl">原始大圖</div></div>
    <div class="item"><img src="kobe.svg" width="72" height="72"><div class="lbl">選擇器</div></div>
    <div class="item"><img src="kobe.svg" width="40" height="40"><div class="lbl">名單</div></div>
  </div>
  <div class="row">
    <img src="kobe.svg"><span class="nm">🥇 小明教練</span><span class="sc">1480</span>
  </div>
  <p style="color:#9aa3c7;font-size:.85rem">這就是它在排行榜一列的樣子</p>
</body>
</html>
