<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#7b3fb0"/>
      <stop offset="1" stop-color="#43205f"/>
    </radialGradient>
    <clipPath id="c"><circle cx="50" cy="50" r="48"/></clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="100" height="100" fill="url(#bg)"/>
    <circle cx="50" cy="60" r="40" fill="#FDB927" opacity="0.16"/>

    <!-- 肩膀 / 球衣 -->
    <path d="M22 100 V84 Q22 70 50 70 Q78 70 78 84 V100 Z" fill="#FDB927"/>
    <path d="M28 100 V85 Q28 74 50 74 Q72 74 72 85 V100 Z" fill="#552583"/>
    <!-- 背心肩帶 -->
    <path d="M40 74 Q44 66 47 73" stroke="#FDB927" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M60 74 Q56 66 53 73" stroke="#FDB927" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="50" y="95" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="13" font-weight="900" fill="#fff">24</text>

    <!-- 脖子 -->
    <rect x="43" y="58" width="14" height="14" rx="6" fill="#a86a36"/>

    <!-- 頭 -->
    <circle cx="50" cy="42" r="26" fill="#c2853f"/>
    <!-- 耳朵 -->
    <circle cx="25" cy="44" r="5" fill="#c2853f"/>
    <circle cx="75" cy="44" r="5" fill="#c2853f"/>

    <!-- 頭髮 -->
    <path d="M25 38 Q26 18 50 17 Q74 18 75 38 Q70 28 50 27 Q30 28 25 38 Z" fill="#15110f"/>
    <!-- 金色髮帶 -->
    <rect x="25" y="33" width="50" height="7" rx="3" fill="#FDB927"/>
    <rect x="25" y="33" width="50" height="2.5" rx="1" fill="#fff" opacity="0.35"/>

    <!-- 眉毛（自信） -->
    <path d="M33 43 Q39 39 45 42" stroke="#15110f" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M55 42 Q61 39 67 43" stroke="#15110f" stroke-width="2.6" fill="none" stroke-linecap="round"/>

    <!-- 大眼睛 + 反光 -->
    <ellipse cx="39" cy="48" rx="6.5" ry="7.5" fill="#fff"/>
    <ellipse cx="61" cy="48" rx="6.5" ry="7.5" fill="#fff"/>
    <circle cx="40" cy="49" r="3.6" fill="#2a1a0c"/>
    <circle cx="60" cy="49" r="3.6" fill="#2a1a0c"/>
    <circle cx="38" cy="46" r="1.6" fill="#fff"/>
    <circle cx="58" cy="46" r="1.6" fill="#fff"/>

    <!-- 鼻子 -->
    <ellipse cx="50" cy="53" rx="1.6" ry="1.2" fill="#9c6126"/>

    <!-- 招牌微笑 -->
    <path d="M42 58 Q50 64 58 58" stroke="#3a1f0c" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <!-- 腮紅 -->
    <ellipse cx="31" cy="54" rx="4.5" ry="2.6" fill="#ef9a9a" opacity="0.45"/>
    <ellipse cx="69" cy="54" rx="4.5" ry="2.6" fill="#ef9a9a" opacity="0.45"/>

    <!-- 籃球 -->
    <g transform="translate(80,82)">
      <circle r="11" fill="#e8862e"/>
      <path d="M-11 0 H11 M0 -11 V11 M-8 -7 Q0 0 8 7 M8 -7 Q0 0 -8 7" stroke="#3a1f0c" stroke-width="1.3" fill="none"/>
    </g>
  </g>

  <circle cx="50" cy="50" r="48" fill="none" stroke="#FDB927" stroke-width="3.5"/>
</svg>
